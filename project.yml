name: RunAbroadLocal

options:
  bundleIdPrefix: com.minis
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  RunAbroadLocal:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: Sources
      - path: Support/Assets.xcassets
      - path: www
        buildPhase: resources
        type: folder
        createIntermediateGroups: true

    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 润学导航
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minis.runabroadlocal
        PRODUCT_NAME: RunAbroadLocal
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

    scheme:
      testTargets: []
